<script>
if ("serviceWorker" in navigator) {
  // Auto-update: reload once when a new service worker takes control (skips waiting on its own).
  // Guard so first-install (no previous controller) and reload loops don't trigger it.
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloading || !hadController) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    // updateViaCache:none => the browser always fetches sw.js fresh (bypasses the HTTP cache)
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
      reg.update();
      setInterval(() => reg.update(), 60 * 1000);              // check every minute while open
      document.addEventListener("visibilitychange", () => {   // and whenever the app regains focus
        if (document.visibilityState === "visible") reg.update();
      });
    }).catch(() => {});
  });
}
</script>
